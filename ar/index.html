<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
  <title>AR 花朵</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
    #overlay {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #000; color: #fff; z-index: 20;
      font-size: 18px; text-align: center; padding: 32px;
      transition: opacity 0.5s;
    }
    #overlay.hidden { opacity: 0; pointer-events: none; }
    #overlay h1 { font-size: 24px; margin-bottom: 8px; font-weight: 500; }
    #overlay p { color: #999; margin-top: 0; font-size: 14px; }
    #start-btn {
      margin-top: 24px; padding: 14px 48px; font-size: 18px;
      background: #007aff; color: #fff; border: none; border-radius: 28px;
      cursor: pointer;
    }
    #hint {
      position: absolute; bottom: 40px; left: 0; right: 0;
      text-align: center; color: #fff; z-index: 10;
      background: rgba(0,0,0,0.45); padding: 10px 20px;
      border-radius: 20px; width: fit-content; margin: 0 auto;
      font-size: 14px; pointer-events: none; display: none;
    }
    #status {
      position: absolute; top: 50px; left: 0; right: 0;
      text-align: center; color: rgba(255,255,255,0.6); z-index: 10;
      font-size: 13px; pointer-events: none; display: none;
    }
  </style>
</head>
<body>
  <div id="overlay">
    <h1>🌿 AR 花朵展示</h1>
    <p>在现实世界中放置 3D 花朵</p>
    <button id="start-btn">开始 AR</button>
  </div>
  <div id="status">正在检测平面...</div>
  <div id="hint">点击屏幕放置花朵</div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    // --- 场景初始化 ---
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 100);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.xr.enabled = true;
    document.body.appendChild(renderer.domElement);

    // 灯光
    const ambient = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambient);
    const dir = new THREE.DirectionalLight(0xffffff, 1.5);
    dir.position.set(1, 3, 2);
    scene.add(dir);
    const fill = new THREE.DirectionalLight(0x88ccff, 0.5);
    fill.position.set(-1, 0.5, -1);
    scene.add(fill);
    const hemi = new THREE.HemisphereLight(0x87ceeb, 0x3a7d44, 0.6);
    scene.add(hemi);

    // --- 加载花模型 ---
    const gltfLoader = new GLTFLoader();
    let flowerTemplate = null;

    gltfLoader.load(
      './flower.glb',
      (gltf) => {
        flowerTemplate = gltf.scene;
        flowerTemplate.scale.set(0.1, 0.1, 0.1);
        flowerTemplate.visible = false;
        scene.add(flowerTemplate);
        document.getElementById('status').textContent = '移动手机扫描平面';
      },
      undefined,
      (err) => {
        console.error('模型加载失败:', err);
        document.getElementById('status').textContent = '❌ 模型加载失败';
      }
    );

    // --- 准星 ---
    const ringGeo = new THREE.TorusGeometry(0.08, 0.012, 16, 32);
    const ringMat = new THREE.MeshBasicMaterial({ color: 0x00ccff, transparent: true, opacity: 0.8 });
    const reticle = new THREE.Mesh(ringGeo, ringMat);
    reticle.visible = false;
    scene.add(reticle);

    const dotGeo = new THREE.CircleGeometry(0.015, 16);
    const dotMat = new THREE.MeshBasicMaterial({ color: 0x00ccff, transparent: true, opacity: 0.5, depthWrite: false });
    const dot = new THREE.Mesh(dotGeo, dotMat);
    dot.rotation.x = -Math.PI / 2;
    reticle.add(dot);

    // --- UI 元素 ---
    const overlay = document.getElementById('overlay');
    const statusEl = document.getElementById('status');
    const hintEl = document.getElementById('hint');
    const startBtn = document.getElementById('start-btn');

    // --- AR 相关变量 ---
    let hitTestSource = null;
    let referenceSpace = null;
    let arSession = null;

    // --- 启动 AR ---
    startBtn.addEventListener('click', async () => {
      try {
        if (!navigator.xr) {
          statusEl.textContent = '❌ 浏览器不支持 WebXR';
          statusEl.style.display = 'block';
          return;
        }
        const supported = await navigator.xr.isSessionSupported('immersive-ar');
        if (!supported) {
          statusEl.textContent = '❌ 设备不支持 AR';
          statusEl.style.display = 'block';
          return;
        }

        arSession = await navigator.xr.requestSession('immersive-ar', {
          requiredFeatures: ['hit-test'],
        });

        arSession.addEventListener('end', () => {
          arSession = null;
          hitTestSource = null;
          referenceSpace = null;
          overlay.classList.remove('hidden');
          overlay.querySelector('h1').textContent = 'AR 已结束';
        });

        renderer.xr.setSession(arSession);
        overlay.classList.add('hidden');
        statusEl.style.display = 'block';
        hintEl.style.display = 'block';
      } catch (e) {
        statusEl.textContent = '❌ AR 启动失败: ' + e.message;
        statusEl.style.display = 'block';
        console.error(e);
      }
    });

    // --- 点击放置 ---
    renderer.domElement.addEventListener('click', () => {
      if (reticle.visible && flowerTemplate) {
        const clone = flowerTemplate.clone();
        clone.position.copy(reticle.position);
        clone.quaternion.identity();
        clone.visible = true;
        scene.add(clone);
        // 渐入动画
        clone.scale.set(0.01, 0.01, 0.01);
        const grow = () => {
          if (clone.scale.x < 0.1) {
            clone.scale.setScalar(clone.scale.x + 0.008);
            requestAnimationFrame(grow);
          }
        };
        grow();
      }
    });

    // --- 渲染循环 ---
    renderer.setAnimationLoop((timestamp, frame) => {
      if (frame) {
        const session = frame.session;
        if (!referenceSpace) {
          referenceSpace = renderer.xr.getReferenceSpace();
        }
        if (!hitTestSource) {
          session.requestHitTestSource({ space: referenceSpace })
            .then(src => { hitTestSource = src; })
            .catch(() => {});
        }

        if (hitTestSource) {
          const results = frame.getHitTestResults(hitTestSource);
          if (results.length > 0) {
            const pose = results[0].getPose(referenceSpace);
            if (pose) {
              reticle.visible = true;
              reticle.position.copy(pose.transform.position);
              reticle.quaternion.identity();
              statusEl.textContent = '已检测到平面 ✅';
            }
          } else {
            reticle.visible = false;
            statusEl.textContent = '移动手机扫描平面...';
          }
        }
      }
      renderer.render(scene, camera);
    });

    // --- 窗口自适应 ---
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
